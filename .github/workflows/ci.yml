name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: node tests/model.test.js

      - name: Validate manifest.json
        run: python3 -m json.tool manifest.json > /dev/null
